name: Anchored Scan (live test)
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: s
        uses: ./
        with:
          path: fixture
      - run: echo "mode=${{ steps.s.outputs.mode }} copies=${{ steps.s.outputs.copies }} failed=${{ steps.s.outputs.failed }}"
